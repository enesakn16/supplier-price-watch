name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and release tooling
        run: python -m pip install --upgrade pip && python -m pip install -e . build twine

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'import importlib.metadata; print(importlib.metadata.version("supplier-price-watch"))')"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match package version $package_version" >&2
            exit 1
          fi

      - name: Verify changelog contains a finalized release
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          escaped_version="${tag_version//./\\.}"
          if ! grep -Eq "^## [[]${escaped_version}[]] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a dated release heading for ${tag_version}" >&2
            exit 1
          fi

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Smoke test installed CLI entry points
        run: |
          supplier-price-watch --help >/dev/null
          supplier-price-watch-xlsx --help >/dev/null

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify built wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          release_venv="$RUNNER_TEMP/release-venv"
          python -m venv "$release_venv"
          "$release_venv/bin/python" -m pip install dist/*.whl
          "$release_venv/bin/python" -m pip check
          cd "$(mktemp -d)"
          "$release_venv/bin/supplier-price-watch" --help >/dev/null
          "$release_venv/bin/supplier-price-watch-xlsx" --help >/dev/null

      - name: Generate and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
